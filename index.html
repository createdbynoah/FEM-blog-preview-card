<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./styles.css" />

    <title>Frontend Mentor | Blog preview card</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  </head>
  <body>
    <main class="container">
      <article class="card">
        <figure class="card-image">
          <img
            src="./assets/images/illustration-article.svg"
            alt="Article illustration"
          />
        </figure>
        <section class="card-content">
          <span class="tag meta-text font-bold">Learning</span>
          <p class="meta-text">Published 21 Dec 2023</p>
          <h1 class="card-title">HTML & CSS foundations</h1>
          <p class="card-text">
            These languages are the backbone of every website, defining
            structure, content, and presentation.
          </p>
        </section>
        <section class="card-author">
          <img
            class="author-avatar"
            src="./assets/images/image-avatar.webp"
            alt="Author avatar"
          />
          <p class="meta-text font-bold">Greg Hooper</p>
        </section>
      </article>
      <footer class="attribution">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
          >Frontend Mentor</a
        >. Coded by <a href="https://noahrodgers.dev">Noah Rodgers</a>.
      </footer>
    </main>
  </body>
</html>
